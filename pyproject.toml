[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rlvr-reasoning-trainer"
version = "0.1.0"
description = "Production-grade RLVR pipeline using GRPO and deterministic verifiers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.48.0",
    "trl>=0.14.0",
    "accelerate>=0.34.0",
    "peft>=0.14.0",
    "datasets>=3.0.0",
    "sympy>=1.13.0",
    "pydantic>=2.8.0",
    "pytest>=8.0.0",
    "rich>=13.7.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
