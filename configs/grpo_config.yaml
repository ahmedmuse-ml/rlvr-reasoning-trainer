model_name_or_path: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
output_dir: "outputs/grpo-run-01"

# GRPO Core Sampling
num_generations: 8          # N outputs generated per prompt
max_prompt_length: 512
max_completion_length: 512
temperature: 0.8

# Optimization & Stabilization
beta: 0.04                  # KL divergence penalty
learning_rate: 1.0e-6
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
num_train_epochs: 1

# Logging & Checkpoints
logging_steps: 5
save_steps: 50
report_to: "none"           # U beddel "wandb" marka Cloud GPU la tago

# vLLM Rollout Acceleration
use_vllm: true