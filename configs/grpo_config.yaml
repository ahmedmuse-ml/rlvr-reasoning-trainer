model_name_or_path: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
output_dir: "outputs/grpo-run-01"

# GRPO core
num_generations: 8          # N completions per prompt (group size)
max_prompt_length: 512
max_completion_length: 1024
temperature: 1.0
top_p: 1.0

# Reward weighting (accuracy > format > length)
reward_weights: [1.0, 0.5, 0.2]

# GRPO stabilization
beta: 0.04                  # KL penalty coefficient vs reference policy
epsilon: 0.2                # clip range
epsilon_high: 0.28          # clip-higher (DAPO-style, asymmetric)
use_dynamic_sampling: true  # skip zero-gradient groups (all-same-reward)

# Training
learning_rate: 1.0e-6
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
num_train_epochs: 1
save_steps: 50
logging_steps: 5
report_to: "wandb"

# vLLM rollout
use_vllm: true
vllm_gpu_memory_utilization: 0.5